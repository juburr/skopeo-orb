description: >
  Installs skopeo for Linux on amd64 or arm64, picked from the machine's CPU
  architecture. skopeo publishes source releases only, so this builds the
  release with a pinned Go toolchain, which takes a few minutes, and installs
  the binary only if its SHA-512 checksum matches the one this orb pins for
  that release. With caching on, later jobs install the verified binary from
  the cache instead. Run this before the orb's other commands.
parameters:
  caching:
    type: boolean
    default: true
    description: >
      Cache the built binary between jobs, keyed by version, CPU architecture
      and home directory, so only the first job builds it. Only verified
      binaries are cached, and a cached binary is verified again before it is
      installed.
  install_path:
    type: string
    default: ""
    description: >
      Absolute path of the directory to install skopeo into. It is created
      if needed and added to the PATH of later steps when it isn't already on
      it, and must be writable without root. Environment variables are
      expanded. Defaults to $HOME/bin.
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      SHA-512 verification against this orb's checksum table. "strict"
      (default) fails before building anything when the version has no
      checksum in the table. "known_versions" verifies listed versions and
      builds and installs unlisted versions unverified, with a warning.
      "false" skips verification of the skopeo binary and is not recommended;
      the Go toolchain that builds it is verified either way.
  version:
    type: string
    default: "1.24.1"
    description: >
      Version of skopeo to install, such as 1.24.1. A leading "v" is
      ignored, and environment variables are expanded.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        # The key is computed from a file that names the CPU (uname -m, as
        # {{ arch }} also encodes the CPU model and would split the cache by
        # host), HOME (a cache is restored to the absolute path it was saved
        # from), and the version with environment variables expanded.
        - run:
            name: Prepare skopeo cache key
            environment:
              ORB_CACHE_KEY_FILE: /tmp/skopeo-orb-cache-key
              PARAM_VERSION: << parameters.version >>
            command: << include(scripts/cache_key.sh) >>
        # A saved cache can't be replaced. Bump v1 when an existing checksum
        # table entry changes, so caches saved for the old bytes stop being
        # restored.
        - restore_cache:
            key: skopeo-orb-v1-<< parameters.version >>-{{ checksum "/tmp/skopeo-orb-cache-key" }}
  - run:
      name: Install skopeo << parameters.version >>
      # A build prints nothing while Go compiles, which takes longer on a
      # small resource class than CircleCI's default 10 minutes allow.
      no_output_timeout: 30m
      environment:
        PARAM_CACHING: << parameters.caching >>
        PARAM_INSTALL_PATH: << parameters.install_path >>
        PARAM_VERIFY_CHECKSUMS: << parameters.verify_checksums >>
        PARAM_VERSION: << parameters.version >>
      command: << include(scripts/install.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - save_cache:
            key: skopeo-orb-v1-<< parameters.version >>-{{ checksum "/tmp/skopeo-orb-cache-key" }}
            paths:
              - ~/.cache/skopeo-orb
