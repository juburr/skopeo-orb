version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.5
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  skopeo-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Builds and installs the default version on a Docker executor, and checks that installing it again
  # takes the verified binary the first install cached instead of building. Then copies a public
  # image to an OCI layout: cimg/base has no signature policy (policy.json), which copy provides.
  command-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - skopeo-orb/install
      - run:
          name: Verify Install
          command: |
            EXPECTED_VERSION=$(yq '.parameters.version.default' src/commands/install.yml)
            command -v skopeo
            skopeo --version
            [[ "$(skopeo --version)" == "skopeo version ${EXPECTED_VERSION}" ]]
      - run:
          name: Verify A Second Install Uses The Cache
          command: |
            VERSION=$(awk '/^  version:/ { found = 1 } found && /default:/ { gsub(/"/, "", $2); print $2; exit }' src/commands/install.yml)
            PARAM_VERSION="${VERSION}" PARAM_VERIFY_CHECKSUMS=strict PARAM_INSTALL_PATH="${HOME}/bin" PARAM_CACHING=true \
              bash src/scripts/install.sh 2>&1 | tee /tmp/second-install.log
            grep -q "Using skopeo ${VERSION} from the cache." /tmp/second-install.log
            if grep -q "Building skopeo" /tmp/second-install.log; then
              echo "FAIL: the second install built skopeo again."
              exit 1
            fi
      - skopeo-orb/copy:
          source: docker://cgr.dev/chainguard/static:latest
          destination: oci:/tmp/static-layout:latest
      - skopeo-orb/inspect:
          image: oci:/tmp/static-layout:latest
          raw: true
          digest_env_var: LAYOUT_DIGEST
      - run:
          name: Verify The Copy To An OCI Layout
          command: |
            echo "SKOPEO_DIGEST=${SKOPEO_DIGEST} LAYOUT_DIGEST=${LAYOUT_DIGEST}"
            if [[ -e /etc/containers/policy.json || -e /usr/share/containers/policy.json ]]; then
              echo "FAIL: this image has a system policy.json, so the copy without one was not tested."
              exit 1
            fi
            [[ "${LAYOUT_DIGEST}" == "${SKOPEO_DIGEST}" ]]
            [[ "$(jq -r '.manifests | length' /tmp/static-layout/index.json)" == "1" ]]
  # Runs install.sh under the verify_checksums default declared in install.yml against a real
  # skopeo release that has no checksum in the lookup table (a missing release cannot explain a failure).
  checksum-test:
    docker:
      - image: cimg/base:current-22.04
    environment:
      UNLISTED_VERSION: 1.13.3
    steps:
      - checkout
      - run:
          name: Unlisted Version Fails Closed By Default
          command: |
            REPO_DIR=$(pwd)
            DEFAULT_MODE=$(yq '.parameters.verify_checksums.default' src/commands/install.yml)
            echo "verify_checksums default: ${DEFAULT_MODE}"
            cd "$(mktemp -d)" && mkdir bin
            if PARAM_INSTALL_PATH="$(pwd)/bin" PARAM_VERIFY_CHECKSUMS="${DEFAULT_MODE}" PARAM_VERSION="${UNLISTED_VERSION}" \
                bash "${REPO_DIR}/src/scripts/install.sh"; then
              echo "FAIL: install succeeded for unlisted version ${UNLISTED_VERSION} under the default."
              exit 1
            fi
            if [[ -e bin/skopeo || -n "$(ls -A | grep -vx bin)" ]]; then
              echo "FAIL: install downloaded, built or installed skopeo before rejecting the unlisted version."
              exit 1
            fi
            echo "PASS: unlisted version ${UNLISTED_VERSION} failed closed before download."
      - run:
          name: known_versions Opt-Out Builds Unlisted Version
          command: |
            REPO_DIR=$(pwd)
            cd "$(mktemp -d)" && mkdir bin
            PARAM_INSTALL_PATH="$(pwd)/bin" PARAM_VERIFY_CHECKSUMS=known_versions PARAM_VERSION="${UNLISTED_VERSION}" \
              bash "${REPO_DIR}/src/scripts/install.sh" 2>&1 | tee install.log
            grep -q "has no checksum for skopeo ${UNLISTED_VERSION}" install.log
            grep -q "UNVERIFIED" install.log
            [[ "$(bin/skopeo --version)" == "skopeo version ${UNLISTED_VERSION}" ]]
  # Builds on an Arm machine. The checksum table was generated by cross-compiling on amd64, so a
  # native arm64 build that passes verification shows the build is the same on either host. A second
  # install must take the binary the first one cached.
  arm64-test:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    steps:
      - checkout
      - skopeo-orb/install
      - run:
          name: Verify A Second Install Uses The Cache
          command: |
            VERSION=$(awk '/^  version:/ { found = 1 } found && /default:/ { gsub(/"/, "", $2); print $2; exit }' src/commands/install.yml)
            PARAM_VERSION="${VERSION}" PARAM_VERIFY_CHECKSUMS=strict PARAM_INSTALL_PATH="${HOME}/bin" PARAM_CACHING=true \
              bash src/scripts/install.sh 2>&1 | tee /tmp/second-install.log
            grep -q "Using skopeo ${VERSION} from the cache." /tmp/second-install.log
            if grep -q "Building skopeo" /tmp/second-install.log; then
              echo "FAIL: the second install built skopeo again."
              exit 1
            fi
      - run:
          name: Verify arm64 Install
          command: |
            if [[ "$(uname -m)" != "aarch64" ]]; then
              echo "FAIL: expected an aarch64 machine, got $(uname -m)."
              exit 1
            fi
            SKOPEO_FILE_TYPE=$(file -L "$(command -v skopeo)")
            echo "${SKOPEO_FILE_TYPE}"
            if [[ "${SKOPEO_FILE_TYPE}" != *"ARM aarch64"* ]]; then
              echo "FAIL: the installed skopeo binary is not an arm64 build."
              exit 1
            fi
            skopeo --version
  # Runs every command (install, login, copy, inspect, list_tags, logout) under one skopeo version
  # against a local registry:2 that requires a login. The workflow runs it for 1.14.0, the oldest
  # release in the checksum table, and for the install command's default. It copies a multi-platform
  # image from cgr.dev into the registry, whole and as one platform. The source is the registry that
  # publishes the image, not a pull-through cache such as mirror.gcr.io, which can be missing the
  # layers of platforms few people pull.
  registry-test:
    parameters:
      skopeo_version:
        type: string
        description: skopeo version to install, or "default" to use the install command's default version.
    machine:
      image: ubuntu-2204:current
    environment:
      REGISTRY_HOST: localhost:5000
      REGISTRY_USER: ci-user
      REGISTRY_SECRET: ci-password
      SOURCE_IMAGE: cgr.dev/chainguard/static:latest
    steps:
      - checkout
      - run:
          name: Start A Registry That Requires A Login
          command: |
            # mirror.gcr.io serves the Docker Hub images without Docker Hub's anonymous pull limits.
            # A pull from it can time out, so pull with retries before running them.
            for image in mirror.gcr.io/library/httpd:2 mirror.gcr.io/library/registry:2; do
              for attempt in 1 2 3; do
                docker pull "${image}" && break
                sleep $((attempt * 10))
              done
            done
            mkdir -p /tmp/registry-auth
            docker run --rm --entrypoint htpasswd mirror.gcr.io/library/httpd:2 -Bbn "${REGISTRY_USER}" "${REGISTRY_SECRET}" \
              > /tmp/registry-auth/htpasswd
            docker run -d --name registry -p 5000:5000 -v /tmp/registry-auth:/auth \
              -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=skopeo-orb-ci \
              -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd mirror.gcr.io/library/registry:2
            # A 401 means the registry is up and refuses anonymous requests.
            for _ in $(seq 1 30); do
              if [[ "$(curl -s -o /dev/null -w '%{http_code}' "http://${REGISTRY_HOST}/v2/")" == "401" ]]; then
                exit 0
              fi
              sleep 1
            done
            echo "FAIL: the registry did not start."
            docker logs registry
            exit 1
      - when:
          condition:
            equal: ["default", << parameters.skopeo_version >>]
          steps:
            - skopeo-orb/install
      - unless:
          condition:
            equal: ["default", << parameters.skopeo_version >>]
          steps:
            - skopeo-orb/install:
                version: << parameters.skopeo_version >>
      - run:
          name: Verify skopeo Version
          command: |
            EXPECTED_VERSION="<< parameters.skopeo_version >>"
            if [[ "${EXPECTED_VERSION}" == "default" ]]; then
              EXPECTED_VERSION=$(awk '/^  version:/ { found = 1 } found && /default:/ { gsub(/"/, "", $2); print $2; exit }' src/commands/install.yml)
            fi
            echo "Expected ${EXPECTED_VERSION}, installed $(skopeo --version)"
            [[ "$(skopeo --version)" == "skopeo version ${EXPECTED_VERSION}" ]]
            printf 'export SKOPEO_VERSION=%q\n' "${EXPECTED_VERSION}" >> "${BASH_ENV}"
      - run:
          name: Read The Source Digests
          command: |
            # The tag can move while the job runs, so the rest of the job uses the image it points to now.
            SOURCE_DIGEST=$(skopeo inspect --raw "docker://${SOURCE_IMAGE}" | skopeo manifest-digest /dev/stdin)
            SOURCE_REF="docker://${SOURCE_IMAGE%:*}@${SOURCE_DIGEST}"
            SOURCE_ARM64_DIGEST=$(skopeo inspect --raw "${SOURCE_REF}" \
              | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
            echo "Source: ${SOURCE_REF}, linux/arm64: ${SOURCE_ARM64_DIGEST}"
            [[ "${SOURCE_ARM64_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf 'export SOURCE_DIGEST=%q\nexport SOURCE_REF=%q\nexport SOURCE_ARM64_DIGEST=%q\n' \
              "${SOURCE_DIGEST}" "${SOURCE_REF}" "${SOURCE_ARM64_DIGEST}" >> "${BASH_ENV}"
      - run:
          name: Wrong Credentials Fail At Login
          command: |
            # The login command's own script, which can't be run as an orb step that must fail.
            if SCRIPT_SKOPEO_LIB="$(cat src/scripts/lib/skopeo.sh)" WRONG_SECRET=wrong PARAM_REGISTRY="${REGISTRY_HOST}" \
                PARAM_USERNAME=REGISTRY_USER PARAM_PASSWORD=WRONG_SECRET PARAM_TLS_VERIFY=false REGISTRY_AUTH_FILE=/tmp/wrong-login.json \
                bash src/scripts/login.sh; then
              echo "FAIL: login accepted a wrong password."
              exit 1
            fi
            echo "PASS: login checks the credentials with the registry."
      - skopeo-orb/login:
          registry: ${REGISTRY_HOST}
          username: REGISTRY_USER
          password: REGISTRY_SECRET
          tls_verify: false
      - skopeo-orb/copy:
          source: ${SOURCE_REF}
          destination: docker://${REGISTRY_HOST}/skopeo-orb-ci/static:copied
          dest_tls_verify: false
      - run:
          name: Verify The Copy
          command: |
            echo "SKOPEO_DIGEST=${SKOPEO_DIGEST}"
            REGISTRY_DIGEST=$(curl -sS --fail -u "${REGISTRY_USER}:${REGISTRY_SECRET}" -o /dev/null -D - \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "http://${REGISTRY_HOST}/v2/skopeo-orb-ci/static/manifests/copied" \
              | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }' | tr -d '\r')
            echo "Registry digest: ${REGISTRY_DIGEST}"
            [[ "${REGISTRY_DIGEST}" == "${SKOPEO_DIGEST}" ]]
            # skopeo 1.14.0 re-encodes an OCI index whose descriptors carry fields it doesn't know,
            # which changes the index's digest; the default version keeps the source's.
            if [[ "${SKOPEO_VERSION}" != "1.14.0" ]]; then
              [[ "${SKOPEO_DIGEST}" == "${SOURCE_DIGEST}" ]]
            fi
            printf 'export COPIED_DIGEST=%q\n' "${SKOPEO_DIGEST}" >> "${BASH_ENV}"
      - skopeo-orb/copy:
          source: ${SOURCE_REF}
          destination: docker://${REGISTRY_HOST}/skopeo-orb-ci/static:arm64
          multi_arch: system
          dest_tls_verify: false
          extra_args: --override-os linux --override-arch arm64
          digest_env_var: ARM64_DIGEST
      - run:
          name: Verify The Single-Platform Copy
          command: |
            echo "ARM64_DIGEST=${ARM64_DIGEST}"
            [[ "${ARM64_DIGEST}" == "${SOURCE_ARM64_DIGEST}" ]]
      - run:
          name: Verify Docker Reads The Stored Login
          command: |
            # The registry refuses anonymous pulls, so this works only with the credentials login stored.
            docker pull --platform linux/arm64 "${REGISTRY_HOST}/skopeo-orb-ci/static:arm64"
      - skopeo-orb/inspect:
          image: docker://${REGISTRY_HOST}/skopeo-orb-ci/static:copied
          tls_verify: false
          no_tags: true
          output_file: /tmp/skopeo-orb-ci/inspect.json
          digest_env_var: INSPECT_DIGEST
      - skopeo-orb/inspect:
          image: docker://${REGISTRY_HOST}/skopeo-orb-ci/static:copied
          raw: true
          tls_verify: false
          output_file: /tmp/skopeo-orb-ci/manifest.json
          digest_env_var: RAW_DIGEST
      - run:
          name: Verify Inspect
          command: |
            echo "INSPECT_DIGEST=${INSPECT_DIGEST} RAW_DIGEST=${RAW_DIGEST}"
            [[ "${INSPECT_DIGEST}" == "${COPIED_DIGEST}" && "${RAW_DIGEST}" == "${COPIED_DIGEST}" ]]
            [[ "$(jq -r .Digest /tmp/skopeo-orb-ci/inspect.json)" == "${COPIED_DIGEST}" ]]
            [[ "$(jq -r .Architecture /tmp/skopeo-orb-ci/inspect.json)" == "amd64" ]]
            [[ "$(jq -r .mediaType /tmp/skopeo-orb-ci/manifest.json)" == "application/vnd.oci.image.index.v1+json" ]]
      - skopeo-orb/list_tags:
          repository: docker://${REGISTRY_HOST}/skopeo-orb-ci/static
          tls_verify: false
          tags_file: /tmp/skopeo-orb-ci/tags.txt
      - run:
          name: Verify List Tags
          command: |
            cat /tmp/skopeo-orb-ci/tags.txt
            [[ "$(sort /tmp/skopeo-orb-ci/tags.txt | tr '\n' ' ')" == "arm64 copied " ]]
      - skopeo-orb/logout:
          registry: ${REGISTRY_HOST}
      - run:
          name: Verify Logout
          command: |
            if skopeo list-tags --tls-verify=false "docker://${REGISTRY_HOST}/skopeo-orb-ci/static"; then
              echo "FAIL: skopeo read the registry after logout."
              exit 1
            fi
            echo "PASS: the registry refuses skopeo after logout."

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - command-test:
          filters: *filters
      - checksum-test:
          filters: *filters
      - arm64-test:
          filters: *filters
      - registry-test:
          name: registry-test-<< matrix.skopeo_version >>
          matrix:
            parameters:
              skopeo_version: ["1.14.0", "default"]
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/skopeo-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - command-test
            - checksum-test
            - arm64-test
            - registry-test
          context: orb-publishing
          filters: *release-filters
