version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  # Runs install.sh against a stand-in Go toolchain, offline: the checksum tables, what strict,
  # known_versions and false do, the Go toolchain's own checksum, the build's settings, and caching.
  test-install:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run install tests
          command: bash tests/install_test.sh
  test-env-subst:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run circleci env subst tests
          command: bash tests/env_subst_test.sh
      - run:
          name: Run shell conventions test
          command: bash tests/shell_conventions_test.sh
  # Runs the command scripts, with PARAM_* set directly, against a stand-in skopeo: the exact arguments
  # each one builds, the password kept off the command line and out of the log, the exported digests,
  # the saved output, and the errors that stop a step before skopeo runs.
  test-commands:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run login tests
          command: bash tests/login_test.sh
      - run:
          name: Run copy, inspect, list_tags and logout tests
          command: bash tests/commands_test.sh

workflows:
  lint-pack:
    jobs:
      - test-install:
          filters: *filters
      - test-env-subst:
          filters: *filters
      - test-commands:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: skopeo
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: skopeo-orb
          requires: [test-install, test-env-subst, test-commands, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
