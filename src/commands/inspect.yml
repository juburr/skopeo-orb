description: >
  Inspects an image with skopeo inspect, without pulling it: its platform,
  layers, labels and environment, its manifest (raw), or its configuration
  (config). Prints the result, can save it to a file, and exports the digest
  of the manifest the image name points to. The rest of the output is read for
  that digest, so a tag that moves in between can't make the two disagree.
parameters:
  image:
    type: string
    description: >
      Image to inspect, named with its transport, such as
      docker://ghcr.io/myorg/myapp:1.0.0. Environment variables are expanded.
  raw:
    type: boolean
    default: false
    description: >
      Print the manifest as the registry stores it. For a multi-platform
      image that is the index. With config, print the configuration as
      stored instead.
  config:
    type: boolean
    default: false
    description: >
      Print the image's configuration (the OCI image config), in a
      normalized form unless raw is also set.
  no_tags:
    type: boolean
    default: false
    description: >
      Leave out the repository's tags (RepoTags), which skopeo otherwise
      lists for a registry image. Listing them is slow for a repository with
      many tags.
  tls_verify:
    type: boolean
    default: true
    description: >
      Require HTTPS with a certificate that verifies. Set it to false only for
      a registry without TLS, such as one on localhost.
  output_file:
    type: string
    default: ""
    description: >
      Also save the output to this file, such as inspect.json. The directory
      is created if needed. Environment variables and a leading ~/ are
      expanded.
  extra_args:
    type: string
    default: ""
    description: >
      More arguments for skopeo inspect, split like shell words, such as
      --override-arch arm64 to describe that platform of a multi-platform
      image. Nothing in them is run as shell code. --format, --raw and
      --config are refused, since they would change the manifest read; use
      raw, config, and output_file with jq.
  digest_env_var:
    type: env_var_name
    default: SKOPEO_DIGEST
    description: >
      Name of the environment variable to set, for later steps, to the digest
      of the manifest the image name points to, such as sha256:4c1f…. For a
      multi-platform image it is the index's.
steps:
  - run:
      name: skopeo Inspect
      environment:
        PARAM_CONFIG: << parameters.config >>
        PARAM_DIGEST_ENV_VAR: << parameters.digest_env_var >>
        PARAM_EXTRA_ARGS: << parameters.extra_args >>
        PARAM_IMAGE: << parameters.image >>
        PARAM_NO_TAGS: << parameters.no_tags >>
        PARAM_OUTPUT_FILE: << parameters.output_file >>
        PARAM_RAW: << parameters.raw >>
        PARAM_TLS_VERIFY: << parameters.tls_verify >>
        SCRIPT_SKOPEO_LIB: << include(scripts/lib/skopeo.sh) >>
      command: << include(scripts/inspect.sh) >>
