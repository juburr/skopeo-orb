description: >
  Copies an image with skopeo copy: registry to registry, or between a
  registry and a local directory or archive, without a Docker daemon. Exports
  the digest of the image written, for later steps. Log in to the registries
  first, unless they allow anonymous access. skopeo checks the copy against a
  signature policy (policy.json); when the executor has none, as cimg/base
  doesn't, and extra_args names none, copy uses one that accepts any image,
  as skopeo's distribution packages install by default.
parameters:
  source:
    type: string
    description: >
      Image to copy, named with its transport: docker://<registry>/<repository>:<tag>
      (or @<digest>) for a registry, or oci:, dir:, docker-archive: and the
      other skopeo transports for local images. Environment variables are
      expanded.
  destination:
    type: string
    description: >
      Where to copy it, named the same way, such as
      docker://registry.example.com/myapp:1.0.0. Environment variables are
      expanded.
  multi_arch:
    type: enum
    enum: ["all", "system", "index-only"]
    default: all
    description: >
      What to copy of a multi-platform image. "all" (default here; skopeo's
      own default is system) copies every platform and the index. "system"
      copies only the platform of the machine running the job, or the one
      --override-os/--override-arch in extra_args choose. "index-only"
      copies the index alone. A docker-archive: or docker-daemon:
      destination holds one platform, so set system for those.
  src_tls_verify:
    type: boolean
    default: true
    description: >
      Require HTTPS with a certificate that verifies for the source registry.
      Set it to false only for a registry without TLS, such as one on
      localhost.
  dest_tls_verify:
    type: boolean
    default: true
    description: >
      Require HTTPS with a certificate that verifies for the destination
      registry. Set it to false only for a registry without TLS, such as one
      on localhost.
  extra_args:
    type: string
    default: ""
    description: >
      More arguments for skopeo copy, split like shell words. Nothing in them
      is run as shell code. --preserve-digests, for one, fails the step
      instead of writing the image with a different digest, which older
      skopeo releases can do to a multi-platform index. --policy <file>
      sets the signature policy, as does a CONTAINERS_POLICY_JSON
      environment variable. --digestfile is refused, since copy sets it.
  digest_env_var:
    type: env_var_name
    default: SKOPEO_DIGEST
    description: >
      Name of the environment variable to set, for later steps, to the digest
      of the image written, such as sha256:4c1f…. For a multi-platform copy
      it is the index's.
steps:
  - run:
      name: skopeo Copy
      environment:
        PARAM_DEST_TLS_VERIFY: << parameters.dest_tls_verify >>
        PARAM_DESTINATION: << parameters.destination >>
        PARAM_DIGEST_ENV_VAR: << parameters.digest_env_var >>
        PARAM_EXTRA_ARGS: << parameters.extra_args >>
        PARAM_MULTI_ARCH: << parameters.multi_arch >>
        PARAM_SOURCE: << parameters.source >>
        PARAM_SRC_TLS_VERIFY: << parameters.src_tls_verify >>
        SCRIPT_SKOPEO_LIB: << include(scripts/lib/skopeo.sh) >>
      command: << include(scripts/copy.sh) >>
